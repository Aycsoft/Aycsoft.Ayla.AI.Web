# PR 和主分支使用相同质量门禁，避免本地通过而开源贡献无法复现。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore deploy/Host/CrossCart.AI.Web.Host.csproj
      - run: dotnet format deploy/Host/CrossCart.AI.Web.Host.csproj --verify-no-changes --no-restore
      - run: dotnet build deploy/Host/CrossCart.AI.Web.Host.csproj --no-restore
