server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 100m;

    location = / {
        return 302 /ai-workbench/;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: $scheme://$http_host/sitemap.xml\n";
    }

    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>$scheme://$http_host/ai-workbench/</loc><changefreq>weekly</changefreq><priority>1.0</priority></url><url><loc>$scheme://$http_host/ai-workbench/about.html</loc><changefreq>monthly</changefreq><priority>0.8</priority></url></urlset>';
    }

    location /ai-workbench/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /ai-workbench/index.html;
    }

    location /api/ {
        proxy_pass http://crosscart-ai:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
