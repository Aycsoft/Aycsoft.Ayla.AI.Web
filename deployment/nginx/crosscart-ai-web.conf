# CrossCart.AI.Web - Nginx same-origin deployment
#
# Build the Web application with VITE_APP_BASE_PATH=/ai-workbench/ and copy
# the contents of dist/ to /var/www/crosscart-ai-web/ai-workbench/.
# CrossCart.AI.Api must listen on http://localhost:5088 on the same machine.

upstream crosscart_ai_api {
    server localhost:5088;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/crosscart-ai-web;
    index index.html;

    client_max_body_size 25m;

    # Always use the canonical directory URL expected by Vite's base path.
    location = /ai-workbench {
        return 301 /ai-workbench/;
    }

    # Vite emits content-hashed assets, so they can be cached permanently.
    location ^~ /ai-workbench/assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Vue uses hash history. The fallback also protects direct requests for
    # future non-hash routes without making missing assets return index.html.
    location /ai-workbench/ {
        try_files $uri $uri/ /ai-workbench/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Streaming chat: disable buffering/compression so SSE events arrive as
    # soon as ASP.NET Core flushes them.
    location = /api/public/chat/stream {
        proxy_pass http://crosscart_ai_api;
        include /etc/nginx/snippets/crosscart-ai-proxy-headers.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no always;
    }

    location = /api/workspace/chat/stream {
        proxy_pass http://crosscart_ai_api;
        include /etc/nginx/snippets/crosscart-ai-proxy-headers.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no always;
    }

    # Authenticated attachment upload. Request buffering is disabled so large
    # files do not have to be fully written to Nginx temporary storage first.
    location = /api/sso/attachments {
        proxy_pass http://crosscart_ai_api;
        include /etc/nginx/snippets/crosscart-ai-proxy-headers.conf;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    # JSON API, generated-file preview/download and all other AI endpoints.
    # proxy_pass has no URI suffix, so the complete /api/... path is preserved.
    location /api/ {
        proxy_pass http://crosscart_ai_api;
        include /etc/nginx/snippets/crosscart-ai-proxy-headers.conf;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    location = /health/live {
        proxy_pass http://crosscart_ai_api;
        include /etc/nginx/snippets/crosscart-ai-proxy-headers.conf;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://crosscart_ai_api;
        include /etc/nginx/snippets/crosscart-ai-proxy-headers.conf;
        access_log off;
    }

}
